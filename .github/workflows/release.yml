# Publish a release that BRAT and Obsidian can install from: bump the version
# in manifest.json, package.json, versions.json and CLIENT_VERSION in
# src/controller.ts, then push a tag equal to it (no "v" prefix), e.g.
# `git tag 0.2.0`.
#
# The build runs with a read-only token and no dependency lifecycle scripts;
# only the publish job, which runs no project code, may write to the repository.
# Actions are pinned by commit; the comment names the tag the commit had.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BINARYEN_VERSION: version_133
      # sha256 of binaryen-version_133-x86_64-linux.tar.gz, from the release's .sha256 file.
      BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
      DYBATPHO_DIR: ${{ github.workspace }}/vendor/dybatpho
      WASM_OPT: ${{ github.workspace }}/vendor/binaryen/bin/wasm-opt
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # No dependency cache: a release is built from the lockfile alone. setup-node
      # v4 caches only when `cache` is set; caching by default, which zizmor
      # assumes, came in v5.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # zizmor: ignore[cache-poisoning] v4.4.0
        with:
          node-version: 26
      - run: npm ci --ignore-scripts
      # The dybw-core WASM module main.js embeds: the public core at the commit in core.rev, built with the
      # toolchain the core's own CI pins (its wasm-vectors job).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: dynamotn/dybatpho
          ref: 67b2b992c1fb6100a5ac8a65a1d7f92372feffb1
          path: vendor/dybatpho
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable ref; the input picks the toolchain
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: wasm-bindgen@0.2.129
      - name: Install binaryen
        run: |
          tarball="binaryen-$BINARYEN_VERSION-x86_64-linux.tar.gz"
          curl -sSfLO "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN_VERSION/$tarball"
          echo "$BINARYEN_SHA256  $tarball" | sha256sum -c -
          mkdir -p vendor/binaryen
          tar -xzf "$tarball" -C vendor/binaryen --strip-components 1
          rm "$tarball"
          "$WASM_OPT" --version
      - run: scripts/build-core.sh

      - name: Check that the tag matches the plugin version
        run: |
          manifest=$(jq -r .version manifest.json)
          package=$(jq -r .version package.json)
          client=$(sed -n 's/^const CLIENT_VERSION = "\(.*\)";$/\1/p' src/controller.ts)
          for version in "$manifest" "$package" "$client"; do
            if [[ "$version" != "$GITHUB_REF_NAME" ]]; then
              echo "::error::tag $GITHUB_REF_NAME, manifest.json $manifest, package.json $package and CLIENT_VERSION $client must be equal"
              exit 1
            fi
          done
          min_app=$(jq -r .minAppVersion manifest.json)
          if [[ "$(jq -r --arg v "$GITHUB_REF_NAME" '.[$v] // empty' versions.json)" != "$min_app" ]]; then
            echo "::error::versions.json must map $GITHUB_REF_NAME to minAppVersion $min_app"
            exit 1
          fi

      - run: npm run lint
      - run: npm run build
      - run: npm run check:bundle
      # Handed over before the tests run, so test dependencies never get to touch
      # the files; publish still waits for this whole job to pass.
      - run: |
          echo "dybw-core $(cat core.rev)"
          sha256sum main.js manifest.json vendor/dybw-core/dybw_core_wasm_bg.wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            main.js
            manifest.json
          if-no-files-found: error
          retention-days: 1
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
      - run: sha256sum main.js manifest.json
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
