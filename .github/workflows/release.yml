# Publish a release that BRAT and Obsidian can install from: bump the version
# in manifest.json, package.json, versions.json and CLIENT_VERSION in
# src/bw/api.ts, then push a tag equal to it (no "v" prefix), e.g.
# `git tag 0.2.0`.
#
# The build runs with a read-only token and no dependency lifecycle scripts;
# only the publish job, which runs no project code, may write to the repository.
# Actions are pinned by commit; the comment names the tag the commit had.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # No dependency cache: a release is built from the lockfile alone. setup-node
      # v4.4.0 (the commit below) caches only when `cache` is set; caching by
      # default, which zizmor assumes, came in v5.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 26
      - run: npm ci --ignore-scripts

      - name: Check that the tag matches the plugin version
        run: |
          manifest=$(jq -r .version manifest.json)
          package=$(jq -r .version package.json)
          client=$(sed -n 's/^const CLIENT_VERSION = "\(.*\)";$/\1/p' src/bw/api.ts)
          for version in "$manifest" "$package" "$client"; do
            if [[ "$version" != "$GITHUB_REF_NAME" ]]; then
              echo "::error::tag $GITHUB_REF_NAME, manifest.json $manifest, package.json $package and CLIENT_VERSION $client must be equal"
              exit 1
            fi
          done
          min_app=$(jq -r .minAppVersion manifest.json)
          if [[ "$(jq -r --arg v "$GITHUB_REF_NAME" '.[$v] // empty' versions.json)" != "$min_app" ]]; then
            echo "::error::versions.json must map $GITHUB_REF_NAME to minAppVersion $min_app"
            exit 1
          fi

      - run: npm run lint
      - run: npm run build
      - run: npm run check:bundle
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser

      - run: sha256sum main.js manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            main.js
            manifest.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
      - run: sha256sum main.js manifest.json
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
